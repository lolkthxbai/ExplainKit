name: Swift Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build iPhone demo
        run: >-
          xcodebuild -quiet
          -project Examples/SwiftMendDemoApp/SwiftMendDemoApp.xcodeproj
          -scheme SwiftMendDemoApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
